[package]
name = "chrono"
version = "0.4.45"
description = "Date and time library for Rust"
homepage = "https://github.com/chronotope/chrono"
documentation = "https://docs.rs/chrono/"
repository = "https://github.com/chronotope/chrono"
keywords = ["date", "time", "calendar"]
categories = ["date-and-time"]
readme = "README.md"
license = "MIT OR Apache-2.0"
include = ["src/*", "tests/*.rs", "LICENSE.txt", "CITATION.cff"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "chrono"

[features]
# Don't forget to adjust `ALL_NON_EXCLUSIVE_FEATURES` in CI scripts when adding a feature or an optional dependency.
default = ["clock", "std", "oldtime", "wasmbind"]
alloc = []
defmt = ["dep:defmt", "pure-rust-locales?/defmt"]
libc = []
winapi = ["windows-link"]
std = ["alloc"]
clock = ["winapi", "iana-time-zone", "now"]
now = ["std"]
core-error = []
oldtime = []
wasmbind = ["wasm-bindgen", "js-sys"]
unstable-locales = ["pure-rust-locales"]
# Note that rkyv-16, rkyv-32, and rkyv-64 are mutually exclusive.
rkyv = ["dep:rkyv", "rkyv/size_32"]
rkyv-16 = ["dep:rkyv", "rkyv?/size_16"]
rkyv-32 = ["dep:rkyv", "rkyv?/size_32"]
rkyv-64 = ["dep:rkyv", "rkyv?/size_64"]
rkyv-validation = ["rkyv?/validation"]
# Features for internal use only:
__internal_bench = []

[dependencies]
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0.99", default-features = false, optional = true }
pure-rust-locales = { version = "0.8.2", optional = true }
rkyv = { version = "0.7.43", optional = true, default-features = false }
arbitrary = { version = "1.0.0", features = ["derive"], optional = true }
defmt = { version = "1.0.1", optional = true }

[target.'cfg(all(target_family = "wasm", not(any(target_os = "emscripten", target_os = "wasi"))))'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }       # contains FFI bindings for the JS Date API

[target.'cfg(windows)'.dependencies]
windows-link = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
iana-time-zone = { version = "0.1.45", optional = true, features = ["fallback"] }

[dev-dependencies]
serde_json = { version = "1" }
serde_derive = { version = "1", default-features = false }
similar-asserts = { version = "2.0.0" }
bincode = { version = "1.3.0" }
windows-bindgen = { version = "0.66" }                     # MSRV is 1.74

[target.'cfg(all(target_family = "wasm", not(any(target_os = "emscripten", target_os = "wasi"))))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
features = ["arbitrary", "rkyv", "serde", "unstable-locales"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.playground]
features = ["serde"]

# ─────────────────────────────────────────────────────────────────────────────
# Workspace (upgrade stage)
# ─────────────────────────────────────────────────────────────────────────────
# The `chrono` package above is the workspace root. Only `xtask` is a member and
# inherits the shared `[workspace.package]` metadata (edition 2024, rust-version
# 1.97). The upstream chrono helper crates (`bench`, `fuzz`, `ci/core-test`) stay
# out of the workspace via `exclude`, keeping their own editions and remaining
# mergeable with `chronotope/chrono`. Strict lint policy, profiles, and patches
# are intentionally deferred to the later strict stage.
# ─────────────────────────────────────────────────────────────────────────────

[workspace]
members  = ["xtask"]
exclude  = ["bench", "fuzz", "ci/core-test"]
resolver = "3"

[workspace.package]
version      = "0.4.45"
edition      = "2024"
rust-version = "1.97"
license-file = "LICENSE.txt"
publish      = false
authors      = [
  "Kang Seonghoon <public+rust@mearie.org>",
  "Brandon W Maister <quodlibetor@gmail.com>",
  "Takumi Shimada <hello@takumi.earth>",
]
repository   = "https://github.com/strict-rs/strict-chrono"
readme       = "README.md"

[workspace.dependencies]
template-core = { version = "0.1.0", path = "../template-rs/crates/template-core" }
template-xtask = { version = "0.1.0", path = "../template-rs/crates/template-xtask" }
strict-test-support = { version = "0.1.0", path = "../strict-test-support-rs/crates/strict-test-support" }
