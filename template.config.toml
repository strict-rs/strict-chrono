schema-version = "0.1.0"

[template]
id = "rust-template"

[template.source]
kind = "git"
url = "ssh://git@github.com/takumi-earth/rust-template.git"
branch = "main"

[ecosystems]
order = ["cargo"]

[ecosystems.cargo.layout]
kind = "flat"

[ecosystems.cargo.update]
lockfile-refresh = "when-managed-dependencies-change"

[update.opt-outs]
files    = []
defaults = []
keys     = []
elements = []

[[contracts.lines]]
file = ".gitignore"
ownership = "template-with-consumer-entries"
required = [
  "/target/",
  "**/*.rs.bk",
  "**/*.rmeta",
  "cov/",
  "/report/",
  "/metrics/",
  "/mutants.out/",
  "/mutants.out.old/",
  "**/*.bk",
  "Cargo.lock",
  ".idea/",
  ".vscode/",
  "*.swp",
